project:
  type: book
  output-dir: _output

book:
  title: "Smart Car"
  subtitle: "Sixteen years, four small cars, and 100,000 miles of evidence"
  cover-image: smart_car_cover_art_text.png
  cover-image-alt: "TwoRed in the parking space at Lake San Marcos, California, 08:43 on April 30, 2014, seven minutes before the trip that completed the states and provinces began."
  author:
    - "K. W. Bridges"
    - "Claude (Anthropic)"
  date: today
  chapters:
    - index.qmd
    - part: "The Car"
      chapters:
        - small_cars.qmd
        - is_it_safe.qmd
    - part: "The Drives"
      chapters:
        - the_anchor.qmd
        - expeditions.qmd
        - long_days.qmd
        - the_roads.qmd
        - the_marine_highway.qmd
        - what_driving_cost.qmd
    - part: "The Data"
      chapters:
        - sixteen_years_of_paper.qmd
        - knowing_a_number_is_wrong.qmd
        - what_the_car_cost.qmd
        - a_day_in_a_smart.qmd
        - two_constellations.qmd
        - what_the_record_cannot_say.qmd
    - afterword.qmd
  navbar:
    logo: smart_car_logo_art.png

format:
  html:
    embed-resources: false
    css: styles.css

